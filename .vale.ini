# Prose lint for the CV. `make check` downloads the styles and fails on any alert.
StylesPath = .vale/styles
MinAlertLevel = suggestion
# Pinned releases, so a rule change upstream cannot fail the check without a change here.
Packages = https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip, https://github.com/krishnasunkam/vale-ai-tells/releases/download/v1.0.0/AiTells.zip

[*.md]
BasedOnStyles = write-good, AiTells
